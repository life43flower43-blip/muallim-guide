# فحص كل تعديل قبل دمجه: الأنواع، وقواعد الكود، واختبارات المنطق وسلامة بنك الأسئلة
name: فحص الكود

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: الأنواع
        run: npx tsc --noEmit -p .
      - name: قواعد الكود
        run: npx eslint src --quiet
      - name: الاختبارات
        run: npm test
