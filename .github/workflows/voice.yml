# توليد التعليق الصوتي لفيديو الموقع على فرع media-voice فقط، ثم حفظ الملفات في الفرع نفسه
name: voice
on:
  push:
    branches: [media-voice]
    paths: ["media/voice/lines-chalk.json"]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 media/voice/tts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINES: lines-chalk.json
          OUT: chalk.wav
          PER_LINE: "1"
          SEP: " ،،، "
          STYLE: "اقرأ هذه الجملة المشكولة حرفيًا كما هي بالعربية الفصحى الصحيحة، بصوت معلم دافئ وواضح، ولا تضف شيئًا: "
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media/voice/c_*.wav
          git commit -m "التعليق الصوتي للفيديو" && git push
