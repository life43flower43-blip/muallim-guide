# مرسل احتياطي للإشعار اليومي: يستدعي /api/push/cron في موعد المساء (٧ مساءً بتوقيت مكة)
# لا يتكرر الإشعار: الخادم يرسل لكل جهاز مرة واحدة في اليوم مهما تكرر الاستدعاء
name: push-cron

on:
  schedule:
    - cron: "45 15 * * *" # ٦:٤٥ مساءً بتوقيت مكة، فيصل قرابة السابعة مع تأخر جدولة GitHub
    - cron: "15 16 * * *" # محاولة ثانية إن تأخرت الأولى
  workflow_dispatch:
    inputs:
      slot:
        description: "morning | noon | evening"
        default: "evening"
      force:
        description: "1 = إرسال فوري تجريبي حتى لو أُرسل اليوم"
        default: "0"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLOT: ${{ github.event.inputs.slot || 'evening' }}
      FORCE: ${{ github.event.inputs.force || '0' }}
    steps:
      - name: Send
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          TOKEN=$(openssl rand -hex 24)
          psql "$DATABASE_URL" -q -c "INSERT INTO \"TelegramPost\" (key, \"createdAt\") VALUES ('pushcron:$TOKEN', now());"
          curl -sS -m 60 -H "x-push-token: $TOKEN" "https://muallim-guide.vercel.app/api/push/cron?slot=$SLOT&force=$FORCE"
          echo
