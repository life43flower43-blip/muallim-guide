# توليد التعليق الصوتي بصوت مايكروسوفت على فرع media-voice فقط
name: voice-ms
on:
  push:
    branches: [media-voice]
    paths: ["media/voice/lines-ms.json", "media/voice/tts_ms.py"]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts && python3 media/voice/tts_ms.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media/voice/ms_*.mp3
          git commit -m "التعليق الصوتي بصوت مايكروسوفت" && git push
