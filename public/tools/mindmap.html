<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة نظريات التعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a pannable radial-tree canvas beside a reading panel; six schools of thought, one hue each */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #15202B;
  --muted: #5A6775;
  --line: #D6DCE2;
  --grid: #DDE2E7;
  --b0: #D9480F; /* السلوكية */
  --b1: #1971C2; /* المعرفية */
  --b2: #2B8A3E; /* البنائية الاجتماعية */
  --b3: #7048E8; /* التعلم الاجتماعي */
  --b4: #C2255C; /* الإنسانية */
  --b5: #0B7285; /* نماذج التصميم */
  --b6: #A16207;
  --on-branch: #FFFFFF;
  --font-display: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151B; --surface: #18212A; --ink: #E7ECF1; --muted: #9AA7B4; --line: #2A3540; --grid: #222C36;
    --b0: #FF8A4C; --b1: #5AA9F0; --b2: #5CC46F; --b3: #A08BFF; --b4: #F06595; --b5: #3BC2D4; --b6: #E3A33B;
    --on-branch: #0F151B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151B; --surface: #18212A; --ink: #E7ECF1; --muted: #9AA7B4; --line: #2A3540; --grid: #222C36;
  --b0: #FF8A4C; --b1: #5AA9F0; --b2: #5CC46F; --b3: #A08BFF; --b4: #F06595; --b5: #3BC2D4; --b6: #E3A33B;
  --on-branch: #0F151B; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 24px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.25; margin: 2px 0 0; text-wrap: balance; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; }
.search input {
  font: inherit; font-size: 14px; width: min(260px, 70vw); padding: 8px 36px 8px 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.search input:focus-visible { outline: 2px solid var(--b1); outline-offset: 1px; }
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; }
.count { font-size: 12px; color: var(--muted); min-width: 4.5em; font-variant-numeric: tabular-nums; }
.btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; line-height: 1.5;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--b1); outline-offset: 2px; }
a.btn { text-decoration: none; display: inline-block; }
.btn.icon { width: 34px; padding: 6px 0; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: flex; flex-wrap: nowrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); justify-self: start; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 999px; padding: 7px 16px; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs button:focus-visible { outline: 2px solid var(--b1); outline-offset: 2px; }
.illus .st.on.dimmed { opacity: .28; }
.illus text.dig { font-size: 21px; font-weight: 700; direction: ltr; fill: var(--ink); }
.illus .bar { fill: var(--h); }
.illus .bar.alt { fill: var(--muted); }
.illus .axis { stroke: var(--line); stroke-width: 1.5; fill: none; }
.illus .curve { fill: none; stroke: var(--h); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.illus .curve.alt { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
.chip {
  font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px; cursor: pointer; color: var(--ink);
  background: color-mix(in srgb, var(--c) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--surface));
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: block; }
.chip:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: stretch; }
.stage {
  position: relative; min-width: 0; height: max(560px, calc(100dvh - 190px));
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background-color: var(--surface);
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
  touch-action: none; cursor: grab;
}
.stage.dragging { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.zoom { position: absolute; left: 12px; bottom: 12px; display: grid; gap: 6px; }
.hint {
  position: absolute; right: 12px; bottom: 12px; left: 64px; font-size: 12px; color: var(--muted);
  pointer-events: none; text-align: right;
}
.hint span { background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 3px 8px; border-radius: 8px; }

/* nodes */
.node { cursor: pointer; outline: none; }
.node rect.box { stroke-width: 1.2; transition: stroke-width .15s; }
.node text { font-family: var(--font-body); fill: var(--ink); dominant-baseline: central; text-anchor: middle; pointer-events: none; }
.node.d0 rect.box { fill: var(--ink); stroke: var(--ink); }
.node.d0 text { fill: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.node.d1 rect.box { fill: var(--h); stroke: var(--h); }
.node.d1 text { fill: var(--on-branch); font-weight: 700; font-size: 16px; }
.node.dn rect.box { fill: color-mix(in srgb, var(--h) 11%, var(--surface)); stroke: color-mix(in srgb, var(--h) 45%, var(--surface)); }
.node.dn text { font-weight: 600; font-size: 14.5px; }
.node.d3 text { font-weight: 500; font-size: 14px; }
.node:hover rect.box, .node:focus-visible rect.box { stroke-width: 2.4; stroke: var(--h); }
.node.d0:hover rect.box, .node.d0:focus-visible rect.box { stroke: var(--b1); }
.node.sel rect.box { stroke-width: 3; stroke: var(--h); }
.node.d0.sel rect.box { stroke: var(--b1); }
.node.sel.d1 rect.box { stroke: var(--ink); }
.node .badge circle { fill: var(--surface); stroke: var(--h); stroke-width: 1.5; }
.node .badge text { fill: var(--h); font-size: 11.5px; font-weight: 700; direction: ltr; }
.node.d0 .badge { display: none; }
.dim .node:not(.hit):not(.d0) { opacity: .28; }
.dim path.link { opacity: .18; }
.node.hit rect.box { stroke-width: 3; stroke: var(--h); }
path.link { fill: none; stroke: var(--h); stroke-linecap: round; opacity: .75; }

/* panel */
aside.panel {
  min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto;
  height: max(560px, calc(100dvh - 190px));
}
.crumbs { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.crumbs button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.crumbs button:hover { color: var(--ink); }
.ptitle { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.3; margin: 0; text-wrap: balance; }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: var(--h); background: color-mix(in srgb, var(--h) 12%, var(--surface)); }
.pdesc { margin: 0; max-width: 62ch; }
.classroom { border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--h) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--h) 25%, var(--surface)); }
.classroom b { display: block; font-size: 12px; letter-spacing: .03em; color: var(--h); margin-bottom: 2px; }
.classroom p { margin: 0; }
.sub h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.sub ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sub li button {
  width: 100%; text-align: right; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
}
.sub li button:hover, .sub li button:focus-visible { border-color: var(--h); outline: none; }
.sub li button small { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
.foot { margin-top: auto; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

/* flowing path from the root to the selected idea */
path.link.flow { stroke-dasharray: 7 7; animation: flow .9s linear infinite; opacity: 1; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.node .play { fill: var(--h); pointer-events: none; }
.node.d1 .play { fill: var(--on-branch); }

/* tour */
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.tourbar {
  position: absolute; top: 12px; right: 12px; left: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px;
}
.tourbar .prog { flex: 1 1 120px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 80px; }
.tourbar .prog i { display: block; height: 100%; width: 0; background: var(--b1); transition: width .4s; }
.tourbar .lbl { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* animated explanation */
.illus { border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 8px; background: var(--bg); display: grid; gap: 6px; }
.illus .ihead { font-size: 12px; font-weight: 700; color: var(--h); display: flex; align-items: center; gap: 6px; }
.illus .ihead::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--h); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.ill-svg svg { width: 100%; height: auto; display: block; overflow: visible; }
.illus text { font-family: var(--font-body); font-size: 12px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.illus text.lbl { font-size: 11px; fill: var(--muted); }
.illus text.sm { font-size: 10.5px; }
.illus text.big { font-size: 30px; font-weight: 700; fill: var(--h); direction: ltr; }
.illus .bx rect { fill: color-mix(in srgb, var(--h) 12%, var(--surface)); stroke: color-mix(in srgb, var(--h) 50%, var(--surface)); stroke-width: 1.2; transition: fill .4s, stroke .4s; }
.illus .bx.hot rect, .illus .lvl.hot { fill: var(--h); stroke: var(--h); }
.illus .bx.hot text { fill: var(--on-branch); font-weight: 700; }
.illus .bx.mute rect { fill: var(--surface); stroke: var(--line); stroke-dasharray: 4 3; }
.illus .bx.mute text { fill: var(--muted); }
.illus .ar { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.illus .ar.hot { stroke: var(--h); stroke-width: 2.2; }
.illus .st { opacity: 0; transform-box: fill-box; transform-origin: center;
  transition: opacity .5s ease, transform .8s cubic-bezier(.2,.7,.2,1), stroke-dashoffset .8s ease, fill-opacity .6s; }
.illus .st.on { opacity: 1; }
.illus .st.gone { opacity: 0; }
.illus .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
.illus .draw.on { stroke-dashoffset: 0; }
.illus .reveal { stroke-dasharray: 1; stroke-dashoffset: 1; }
.illus .mv { fill: var(--h); }
.illus .mv.helper { fill: var(--ink); }
.illus .ground { stroke: var(--line); stroke-width: 2; }
.illus .seg { stroke: var(--h); stroke-width: 12; stroke-linecap: round; fill: none; }
.illus .ring { fill: color-mix(in srgb, var(--h) 10%, var(--surface)); stroke: color-mix(in srgb, var(--h) 55%, var(--surface)); stroke-width: 1.4; }
.illus .ring.core { fill: color-mix(in srgb, var(--h) 38%, var(--surface)); stroke: var(--h); }
.illus .ring.out { fill: none; stroke: var(--muted); stroke-dasharray: 4 4; }
.illus .lvl { fill: color-mix(in srgb, var(--h) 16%, var(--surface)); stroke: color-mix(in srgb, var(--h) 55%, var(--surface)); stroke-width: 1.2; }
.illus .bld { fill: var(--h); stroke: var(--h); fill-opacity: .15; }
.illus .pulse.on rect { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-width: 4; } }
.ill-cap { margin: 2px 2px 0; min-height: 3.3em; font-size: 14px; font-weight: 500; line-height: 1.65; }
.ill-ex { border-radius: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--h) 30%, var(--surface)); }
.ill-ex b { display: block; font-size: 12px; color: var(--h); }
.ill-ex p { margin: 0; font-size: 13.5px; }
.ill-cap { min-height: 0 !important; font-weight: 700 !important; }
.ill-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ill-ctl .dots { display: flex; gap: 6px; flex-wrap: wrap; }
.ill-ctl .dots button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; padding: 0; line-height: 1; font-variant-numeric: tabular-nums; }
.ill-ctl .dots button.on { background: var(--h); border-color: var(--h); color: var(--on-branch); }
.ill-ctl .dots button:focus-visible { outline: 2px solid var(--h); outline-offset: 2px; }


/* short illustrated scenes: a timeline toggles states, subtitles run in Arabic */
.scene { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--bg); display: grid; gap: 8px; }
.scene .shead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.scene .shead b { font-size: 12px; color: var(--h); }
.scene .sctl { display: flex; gap: 6px; align-items: center; }
.scene .stage-svg { position: relative; border-radius: 10px; overflow: hidden; background: color-mix(in srgb, var(--h) 6%, var(--surface)); }
.scene svg { width: 100%; height: auto; display: block; }
.scene .sub { min-height: 3.2em; font-size: 14.5px; font-weight: 700; line-height: 1.6; margin: 0; }
.scene .sbar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.scene .sbar i { display: block; height: 100%; width: 0; background: var(--h); }
.scene text { font-family: var(--font-body); text-anchor: middle; dominant-baseline: central; }
.sc .fade { opacity: 0; transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1); transform-box: fill-box; transform-origin: center; }
.sc .fade.on { opacity: 1; }
.sc .slide { transform: translateX(46px); }
.sc .slide.on { transform: none; }
.sc .pop { transform: scale(.6); }
.sc .pop.on { transform: none; }
.sc .ring { transform-box: fill-box; transform-origin: 50% 0; }
.sc .ring.on { animation: sc-ring .22s ease-in-out infinite alternate; }
@keyframes sc-ring { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
.sc .wave { opacity: 0; }
.sc .wave.on { animation: sc-wave 1s ease-out infinite; }
@keyframes sc-wave { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.25); } }
.sc .drip.on { animation: sc-drip 1.1s ease-in infinite; }
@keyframes sc-drip { 0% { transform: translateY(0); opacity: 1; } 80% { transform: translateY(16px); opacity: 1; } 100% { transform: translateY(18px); opacity: 0; } }
.sc .tilt { transition: transform .5s; transform-box: fill-box; transform-origin: 30% 80%; }
.sc .tilt.on { transform: rotate(-14deg); }
.sc .arm { transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-box: fill-box; transform-origin: 50% 8%; }
.sc .arm.on { transform: rotate(160deg); }
.sc .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.sc .bar.on { transform: none; }
.sc .dim { transition: opacity .4s; }
.sc .dim.on { opacity: .3; }
@media (prefers-reduced-motion: reduce) { .sc .ring.on, .sc .wave.on, .sc .drip.on { animation: none; } }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 58svh; min-height: 400px; }
  aside.panel { height: auto; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var t = p.get("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  if (p.get("embed") === "1") document.documentElement.classList.add("embed");
})();
</script>
<style>
.embed body { padding-block: 12px 16px; }
.embed .brand { display: none; }
.embed header { justify-content: flex-start; }
.embed .stage, .embed aside.panel { height: max(480px, calc(100dvh - 150px)); }
.embed .legend, .embed #expand, .embed #collapse, .embed #fit, .embed .hint, .embed .count:empty { display: none; }
.embed .search { display: none; }
.embed.searching .search { display: block; }
.embed .tools { flex-wrap: nowrap; }
.embed header { order: 2; }
.embed .tabs { order: 1; }
.embed main { order: 3; }
.stage:has(.tourbar:not([hidden])) .zoom, .stage:has(.tourbar:not([hidden])) .starter { display: none; }
.embed .wrap { gap: 10px; }
.sheetbar { display: none; }
@media (max-width: 900px) {
  .embed body { padding-block: 10px 0; }
  .embed .stage { height: calc(100dvh - 128px); min-height: 360px; }
  .embed aside.panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 64dvh;
    border-radius: 22px 22px 0 0; border-bottom: 0; padding: 0 18px calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .embed aside.panel.open { transform: none; }
  .embed .sheetbar { display: flex; position: sticky; top: 0; z-index: 2; background: var(--surface); align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0 8px; margin-bottom: -6px; }
  .embed .sheetbar .grip { width: 44px; height: 5px; border-radius: 99px; background: var(--line); }
  .embed .tabs button { padding: 6px 12px; font-size: 13px; }
}
.starter { position: absolute; right: 12px; left: 12px; bottom: 12px; max-width: 420px; margin-inline-start: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 13.5px; line-height: 1.6; display: grid; gap: 2px; }
.starter b { font-size: 13px; color: var(--b1); }
.starter[hidden] { display: none; }
.embed .zoom { bottom: auto; top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow">علم النفس التربوي · خريطة تفاعلية</div>
      <h1 id="maptitle">خريطة نظريات التعلم</h1>
    </div>
    <div class="tools">
      <button class="btn icon" id="qbtn" type="button" aria-label="بحث" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;vertical-align:-3px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="q" type="search" placeholder="ابحث: السقالات، التعزيز، بياجيه…" autocomplete="off" aria-label="بحث في الخريطة">
      </label>
      <span class="count" id="count" aria-live="polite"></span>
      <button class="btn primary" id="tour" type="button">▶ تعلّم خطوة بخطوة</button>
      <button class="btn" id="expand" type="button">فتح الكل</button>
      <button class="btn" id="collapse" type="button">طيّ الكل</button>
      <button class="btn" id="fit" type="button">ملاءمة</button>

  const visSet = new Set(vis.map(n => n.id));
  vis.forEach(n => {
    if (!els.has(n.id)) {
      makeNode(n);
      const p = n.parent;
      n.x = p ? p.x : 0; n.y = p ? p.y : 0;
      dying.delete(n.id);
    } else dying.delete(n.id);

  });

}

const pointers = new Map(); let drag = null, pinch = null;
svg.addEventListener("pointerdown", e => {

  cancelAnimationFrame(vAnim);
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target.closest(".node") };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];

  }

    const [a, b] = [...pointers.values()]; const { L, T } = stageSize();

    zoomAt((a.x + b.x) / 2 - L, (a.y + b.y) / 2 - T, (pinch.k * d / pinch.d) / view.k);

    [[1, 2], [3, 3]].forEach(([t, s2]) => parts += `<circle class="st" data-s="${s2}" cx="${X(t)}" cy="${Y(100)}" r="5" style="fill:var(--h);stroke:var(--surface);stroke-width:2"></circle>` + lab(X(t), Y(100) - 12, "مراجعة", s2, "lbl", 'style="font-size:10px"'));

SCENES.zpd = SCENES.scaffold; SCENES.spacing = SCENES.forgetting;
// ملفات الفيديو الجاهزة للمشاهد (للحفظ والمشاركة)
const SCENE_VIDEO = { pavlov: "pavlov", reinforce: "reinforce", waittime: "waittime", scaffold: "scaffold", zpd: "scaffold", forgetting: "forgetting", spacing: "forgetting", shaping: "shaping", bandura: "bandura", piaget: "piaget", chunking: "chunking", maslow: "maslow", testing: "testing", gestalt: "gestalt", jigsaw: "jigsaw", formative: "formative", meta: "meta", differentiate: "differentiate", kohlberg: "kohlberg", normal: "normal" };

let sceneTimers = [];
function mountScene(fig, spec, key) {
  fig.innerHTML = `<div class="shead"><b>مشهد قصير</b><span class="sctl">${SCENE_VIDEO[key] ? `<a class="btn" href="videos/${SCENE_VIDEO[key]}.mp4" download target="_blank" rel="noopener">⬇ فيديو</a>` : ""}<button class="btn" type="button">▶ أعد المشهد</button></span></div><div class="stage-svg">${spec.svg}</div><p class="sub"></p><div class="sbar"><i></i></div>`;
  const svgEl = fig.querySelector("svg"), sub = fig.querySelector(".sub"), bar = fig.querySelector(".sbar i");
  const play = () => {
    sceneTimers.forEach(clearTimeout); sceneTimers = [];
    svgEl.querySelectorAll(".on").forEach(e => e.classList.remove("on"));
    bar.style.transition = "none"; bar.style.width = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${spec.dur}s linear`; bar.style.width = "100%"; }));
    spec.events.forEach(([t, sel, what, val]) => sceneTimers.push(setTimeout(() => svgEl.querySelectorAll(sel).forEach(e => what === "text" ? (e.textContent = val) : e.classList.toggle(what, !!val)), t * 1000)));
    spec.subs.forEach(([t, text]) => sceneTimers.push(setTimeout(() => { sub.textContent = text; }, t * 1000)));
  };
  fig.querySelector(".shead button.btn").onclick = play;
  if (reduce) { spec.subs.length && (sub.textContent = spec.subs[spec.subs.length - 1][1]); } else play();
  return spec.dur * 1000;
}

let illTimer = null, lastIllDur = 0;
function mountIllus(fig, spec, key) {
  const steps = CAPS[key] || spec.caps.map(c => [c, ""]);
  const n = steps.length, STEP = 2300, END = 3400;
  fig.innerHTML = `<div class="ihead">الفكرة خطوة بخطوة</div><div class="ill-svg">${spec.svg}</div><p class="ill-cap"></p><div class="ill-ex" hidden><b>مثال</b><p></p></div><div class="ill-ctl"><button class="btn icon" type="button" aria-label="إعادة العرض">⟲</button><div class="dots" role="group" aria-label="خطوات الشرح"></div></div>`;
  const s = fig.querySelector("svg"), cap = fig.querySelector(".ill-cap"), dotsEl = fig.querySelector(".dots");
  const ex = fig.querySelector(".ill-ex"), exP = ex.querySelector("p");
  const parts = [...s.querySelectorAll("[data-s]")];
  const dots = steps.map((c, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = i + 1; b.setAttribute("aria-label", "الخطوة " + (i + 1)); b.onclick = () => { clearTimeout(illTimer); show(i + 1); }; dotsEl.append(b); return b; });
  function show(k) {
    parts.forEach(e => {
      e.classList.toggle("on", +e.dataset.s <= k && k > 0);
      if (e.dataset.out) e.classList.toggle("gone", k >= +e.dataset.out);
      if (e.dataset.hot) e.classList.toggle("hot", k === +e.dataset.hot);
      const tf = [];
      if (e.dataset.path) { const p = e.dataset.path.split("|"); const [x, y] = p[Math.max(0, Math.min(k, p.length) - 1)].split(","); tf.push(`translate(${x}px,${y}px)`); }
      if (e.dataset.scale) { const p = e.dataset.scale.split("|"); tf.push(`scale(${p[Math.max(0, Math.min(k, p.length) - 1)]})`); }
      if (tf.length) e.style.transform = tf.join(" ");
      if (e.dataset.reveal) { const p = e.dataset.reveal.split("|"); e.style.strokeDashoffset = k ? 1 - +p[Math.min(k, p.length) - 1] : 1; }
      if (e.dataset.dim) e.classList.toggle("dimmed", k >= +e.dataset.dim);
      if (e.dataset.sx) { const p = e.dataset.sx.split("|"); e.style.transform = `scaleX(${k ? p[Math.min(k, p.length) - 1] : 0})`; }
      if (e.dataset.op) { const p = e.dataset.op.split("|"); e.style.fillOpacity = k ? p[Math.min(k, p.length) - 1] : 0; }
    });
    cap.textContent = k ? steps[k - 1][0] : "";
    exP.textContent = k ? steps[k - 1][1] : ""; ex.hidden = !(k && steps[k - 1][1]);
    dots.forEach((d, i) => d.classList.toggle("on", i < k));
  }
  function loop(k) {
    show(k);
    illTimer = setTimeout(() => k < n ? loop(k + 1) : (show(0), illTimer = setTimeout(() => loop(1), 500)), k < n ? STEP : END);
  }
  fig.querySelector(".ill-ctl > .btn").onclick = () => { clearTimeout(illTimer); show(0); illTimer = setTimeout(() => loop(1), 350); };
  show(0);
  if (reduce) show(n); else illTimer = setTimeout(() => loop(1), 450);
  lastIllDur = reduce ? 6000 : 450 + (n - 1) * STEP + END - 400;
}

// ---------- guided tour ----------
let tourSteps = [];
function buildTour() { tourSteps = [DATA]; DATA.k.forEach(s => { tourSteps.push(s); (function walk(n) { n.k.forEach(c => { if (c.a && !tourSteps.some(t => t.a === c.a)) tourSteps.push(c); walk(c); }); })(s); }); }
buildTour();
const tour = { on: false, playing: false, i: 0, timer: null };
const tbar = document.getElementById("tourbar"), tplay = document.getElementById("tplay");
function tourGo(i) {
  tour.i = Math.max(0, Math.min(tourSteps.length - 1, i));
  const n = tourSteps[tour.i];
  reveal(n); if (n.k.length) n.open = true;
  refresh(); sheet(true); select(n); setTimeout(() => centerOn(n), reduce ? 0 : 60);
  document.getElementById("tprog").style.width = ((tour.i + 1) / tourSteps.length * 100) + "%";
  document.getElementById("tlbl").textContent = `${tour.i + 1} من ${tourSteps.length}`;
  clearTimeout(tour.timer);
  if (tour.playing) tour.timer = setTimeout(() => tour.i + 1 < tourSteps.length ? tourGo(tour.i + 1) : pauseTour(), n.a ? lastIllDur : 6500);
}
function startTour() {
  all.forEach(n => n.open = n.depth === 0);
  tour.on = true; tour.playing = true; tbar.hidden = false; tplay.textContent = "إيقاف مؤقت";
  tourGo(0);
}
function pauseTour() { tour.playing = false; clearTimeout(tour.timer); tplay.textContent = "تشغيل"; }
function endTour() { pauseTour(); tour.on = false; tbar.hidden = true; }
document.getElementById("tour").onclick = startTour;
tplay.onclick = () => { if (tour.playing) pauseTour(); else { tour.playing = true; tplay.textContent = "إيقاف مؤقت"; tourGo(tour.i); } };
document.getElementById("tnext").onclick = () => tourGo(tour.i + 1);
document.getElementById("tprev").onclick = () => tourGo(tour.i - 1);
document.getElementById("tend").onclick = endTour;

// ---------- switching maps ----------
async function switchMap(key) {
  const m = MAPS[key]; if (!m || (m.data && m.data === DATA)) return;
  if (!m.data) {
    try { m.data = await (await fetch(m.src, { cache: "no-cache" })).json(); }
    catch (e) { countEl.textContent = "تعذر تحميل الخريطة، حاول مرة أخرى"; return; }
  }
  endTour(); clearTimeout(illTimer); cancelAnimationFrame(anim);
  for (const [, e] of els) { e.g.remove(); e.path && e.path.remove(); }
  els.clear(); dying.clear();
  q.value = ""; hits = []; countEl.textContent = ""; svg.classList.remove("dim");
  sheet(false); document.getElementById("starter").hidden = false;
  DATA = m.data; prepMap(DATA); indexSearch(); buildLegend(); buildTour();
  document.getElementById("maptitle").textContent = m.title;
  document.title = m.title;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.id === "tab-" + key)));
  boot();
}
document.getElementById("tab-theories").onclick = () => switchMap("theories");
document.getElementById("tab-cognition").onclick = () => switchMap("cognition");
["M4", "M1", "M5", "M2", "SE1", "F1", "AI1", "C1", "G1"].forEach(k => document.getElementById("tab-" + k).onclick = () => switchMap(k));

// ---------- boot ----------
function boot() {
  measure(); layout(); sync();
  all.forEach(n => { n.x = n.X; n.y = n.Y; });
  draw(); select(DATA); fit(false);
}
boot();
{ const want = new URLSearchParams(location.search).get("map"); if (want && MAPS[want] && want !== "theories") switchMap(want); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); for (const id of els.keys()) sizeNode(byId[id]); layout(); all.forEach(n => { n.x = n.X; n.y = n.Y; }); draw(); fit(false); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => fit(), 150); });
